name: Build Aniux Server Keeper APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source archive
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project and build APK
        run: |
          unzip -q AniuxServerKeeper-Android-Source.zip -d source_bundle
          gradle --no-daemon -p source_bundle/AniuxServerKeeper assembleDebug
          cp source_bundle/AniuxServerKeeper/app/build/outputs/apk/debug/app-debug.apk AniuxServerKeeper-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AniuxServerKeeper-debug-apk
          path: AniuxServerKeeper-debug.apk
          if-no-files-found: error
          
